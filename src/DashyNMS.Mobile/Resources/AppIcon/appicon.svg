<?xml version="1.0" encoding="UTF-8"?>
<!-- App icon background: the logo's disc colour, edge to edge. iOS rounds the
     corners and Android applies its own mask shape, so the full square is filled. -->
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">
  <rect x="0" y="0" width="456" height="456" fill="#171B23"/>
</svg>
