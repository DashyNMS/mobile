<?xml version="1.0" encoding="UTF-8"?>
<!-- Tab bar icon, in the website's line-icon style (24px grid, 1.8 stroke). The tab bar tints it, so only its shape matters. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="3" width="7.5" height="7.5" rx="1.6"/>
  <rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6"/>
  <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6"/>
  <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6"/>
</svg>
