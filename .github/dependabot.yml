# Everything is pinned (actions by commit, packages by version and lock file),
# so nothing moves unless Dependabot proposes it. Minor and patch updates are
# grouped; majors come one at a time.
version: 2

# The DashyNMS packages come from GitHub Packages, which needs a login. The
# token is a Dependabot secret (Settings > Secrets and variables > Dependabot):
# DASHYNMS_PACKAGES_TOKEN, a classic token with read:packages only. Without it
# Dependabot can't update the lock files, and its pull requests fail the locked
# restore.
registries:
  dashynms:
    type: nuget-feed
    url: https://nuget.pkg.github.com/DashyNMS/index.json
    username: dependabot
    password: ${{secrets.DASHYNMS_PACKAGES_TOKEN}}

updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: build(deps)
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    commit-message:
      prefix: build(deps)
    directories:
      - /src/*
      - /tests/*
    registries:
      - dashynms
    ignore:
      # Pinned by hand, with the Shared package's hash and commit (see
      # docs/DEVELOPMENT.md, "Moving the Core and Shared pins").
      - dependency-name: "DashyNMS.*"
    schedule:
      interval: weekly
      day: monday
    groups:
      packages:
        update-types: [minor, patch]

  # The real PDF comparison installs PyMuPDF separately from the .NET projects.
  - package-ecosystem: pip
    commit-message:
      prefix: build(deps)
    directory: /tests/ChatPdf
    schedule:
      interval: weekly
      day: monday
    groups:
      packages:
        update-types: [minor, patch]
