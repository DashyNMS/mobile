name: Android

# Builds the signed app and uploads it to Google Play (#24). Called by the edge
# and nightly builds, for the internal testing track, and by the release build,
# which leaves a draft on the production track for someone to submit. Uploads
# wait until the PLAY_UPLOADS repository variable is true, once the Play
# account can take them; until then it only builds.
on:
  workflow_call:
    inputs:
      version:
        description: What to call the files, such as 2.0.0-edge.12
        type: string
        required: true
      track:
        type: string
        default: internal
    outputs:
      build:
        description: The build number it was uploaded with
        value: ${{ jobs.android.outputs.build }}
    secrets:
      ANDROID_UPLOAD_KEYSTORE_BASE64:
        required: false
      ANDROID_UPLOAD_KEYSTORE_PASSWORD:
        required: false
      ANDROID_UPLOAD_KEY_PASSWORD:
        required: false
      ANDROID_UPLOAD_KEY_ALIAS:
        required: false
      PLAY_SERVICE_ACCOUNT_JSON:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false

# Read-only token: the upload uses the Play service account, not GitHub (#7).
permissions:
  contents: read
  packages: read
  # Verifying DashyNMS/mcp's provenance for the shared package (#596, #601).
  attestations: read

jobs:
  android:
    name: Build and upload
    outputs:
      build: ${{ steps.number.outputs.build }}
    # The upload keystore and service account key live in this environment's
    # secrets, which only main can use - as iOS-Build (#5).
    environment: Android-Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPLOAD: ${{ vars.PLAY_UPLOADS == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: microsoft
          java-version: "21"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      # Taken here rather than when the run starts, so re-running a failed upload
      # takes a new number, above any uploaded since. The builds share a queue, so
      # no other upload comes between this and its own.
      - name: Choose the build number
        id: number
        run: |
          BUILD_NUMBER=$(python3 -B -c "import sys; sys.path.insert(0, 'scripts'); import build_version; print(build_version.store_build())")
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Read the version
        run: echo "APP_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)" >> "$GITHUB_ENV"

      # The shared package (#596, #601) is verified after restore and before the
      # publish compiles and ships it; see scripts/verify-shared-package.sh.
      - name: Restore and verify the shared package
        env:
          DASHYNMS_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet restore src/DashyNMS.Mobile.Shared --locked-mode
          scripts/verify-shared-package.sh

      # MobilePlatform=android so restore doesn't also want the iOS workload.
      # The passwords are read from the environment (env:), so they never
      # appear on the command line or in the log.
      - name: Build the bundle and APK
        env:
          # NuGet needs credentials as well as the workflow's packages: read permission.
          DASHYNMS_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD || secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          # Opt-in error reports' key (#217), built into this build only.
          DASHYNMS_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: >
          dotnet publish src/DashyNMS.Mobile
          -p:MobilePlatform=android
          -f net10.0-android
          -c Release
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/upload.jks"
          -p:AndroidSigningKeyAlias="$KEY_ALIAS"
          -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD
          -p:AndroidSigningKeyPass=env:KEY_PASSWORD
          -p:ApplicationVersion="$BUILD_NUMBER"
          -o "$RUNNER_TEMP/out"

      - name: Collect the bundle and APK
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p artifacts/android
          cp "$RUNNER_TEMP"/out/*-Signed.aab "artifacts/android/DashyNMS-$VERSION-android.aab"
          cp "$RUNNER_TEMP"/out/*-Signed.apk "artifacts/android/DashyNMS-$VERSION-android.apk"
          ls -l artifacts/android

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-bundle
          path: artifacts/android/*.aab
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload to Play
        if: env.UPLOAD == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.pckp.DashyNMS
          releaseFiles: artifacts/android/*.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.track == 'internal' && 'completed' || 'draft' }}

      # The release the app reports its errors under (#217), "2.0.0+<build>",
      # recorded once the build is uploaded so testers' reports match it.
      # Bookkeeping only: a Sentry hiccup doesn't fail an upload that worked.
      - name: Record the release in Sentry
        if: env.UPLOAD == 'true' && vars.SENTRY_DSN != ''
        continue-on-error: true
        uses: getsentry/action-release@e6703d0b00208e0b3687ba660d18ab5af7892821 # v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          release: ${{ env.APP_VERSION }}+${{ env.BUILD_NUMBER }}
          set_commits: auto
          ignore_missing: true

      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
