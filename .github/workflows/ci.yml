name: Build and test

on:
  push:
  pull_request:

# Read-only token: CI only checks out and builds (#7).
permissions:
  contents: read
  packages: read

env:
  DASHYNMS_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Mobile's shared code on plain .NET; Core runs its tests upstream.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test shared code
        run: dotnet test tests/DashyNMS.Mobile.Shared.Tests -c Debug


  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: microsoft
          java-version: "21"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build
        run: dotnet build src/DashyNMS.Mobile -f net10.0-android -c Release

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashynms-android
          path: src/DashyNMS.Mobile/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: error

  ios:
    name: iOS (simulator)
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # iOS 27.1 enables the full Duo display and vertical system bars.
      # Keep the .NET workload paired with Xcode instead of runner defaults.
      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --version 10.0.402.1

      - name: Report iOS toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          dotnet workload --info

      # The home-screen widget is a Swift WidgetKit extension (ios-widget/),
      # built on its own and embedded by the app build below.
      - name: Build widget extension
        working-directory: ios-widget
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project DashyNMSWidget.xcodeproj -target DashyNMSWidget \
            -configuration Debug -sdk iphonesimulator \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build

      # MobilePlatform=ios (see the csproj): on macOS the project also targets
      # Android, and restore would otherwise want that workload too.
      # A simulator build needs no signing identity; device builds and
      # App Store packaging are the TestFlight workflow's.
      - name: Build
        run: >
          dotnet build src/DashyNMS.Mobile -p:MobilePlatform=ios -c Debug -p:RuntimeIdentifier=iossimulator-arm64
          -p:IncludeIosWidget=true -p:IosWidgetBuildOutput=Debug-iphonesimulator

      - name: Check the widget is embedded
        run: |
          APP=$(find src/DashyNMS.Mobile/bin/Debug/net10.0-ios -maxdepth 3 -type d -name "*.app" | head -1)
          echo "App bundle: $APP"
          ls "$APP/PlugIns"
          test -d "$APP/PlugIns/DashyNMSWidget.appex"
          plutil -p "$APP/PlugIns/DashyNMSWidget.appex/Info.plist"
