name: Build and test

on:
  push:
  pull_request:

# Read-only token: CI only checks out and builds (#7).
permissions:
  contents: read
  packages: read
  # Reading DashyNMS/mcp's build provenance for the shared package (#596, #601).
  attestations: read

env:
  DASHYNMS_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Mobile's shared code on plain .NET; Core runs its tests upstream.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Test geographic map camera bridge
        run: node --test tests/map/camera.test.mjs

      # Restore, then verify the shared package (#596, #601) is the exact file
      # DashyNMS/mcp's workflow built and attested from the pinned commit on main,
      # and that NuGet extracted it intact, before any test loads it.
      - name: Restore shared code
        run: dotnet restore tests/DashyNMS.Mobile.Shared.Tests

      - name: Verify the shared package
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-shared-package.sh

      # The synthetic shared fixtures must be byte-identical to the ones DashyNMS/mcp
      # tests its MCP tools against.
      - name: Check the shared fixtures match DashyNMS/mcp
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-shared-fixtures.sh

      - name: Test shared code
        run: dotnet test tests/DashyNMS.Mobile.Shared.Tests -c Debug --no-restore


  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: microsoft
          java-version: "21"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # The shared package (#596, #601) is verified after restore and before the
      # build compiles or packs it; see scripts/verify-shared-package.sh.
      - name: Restore and verify the shared package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet restore src/DashyNMS.Mobile.Shared
          scripts/verify-shared-package.sh

      - name: Build
        shell: bash
        run: dotnet build src/DashyNMS.Mobile -f net10.0-android -c Release -bl:"$RUNNER_TEMP/android.binlog" | tee "$RUNNER_TEMP/android-build.log"

      # The shared package (#596, #601) goes through the Release trimmer and AOT
      # like everything else; any trim, AOT or packaging warning naming it fails here.
      - name: Check the shared package in the Release build
        run: |
          if grep -E "warning (IL[0-9]{4}|XA[0-9]{4}|NU[0-9]{4})" "$RUNNER_TEMP/android-build.log" | grep -i "DashyNMS.Agent.Shared"; then
            echo "Warnings name DashyNMS.Agent.Shared"; exit 1
          fi
          find src/DashyNMS.Mobile/obj/Release -name "DashyNMS.Agent.Shared.dll" -printf "%s bytes  %p\n" | tee "$RUNNER_TEMP/shared-dlls.txt"
          test -s "$RUNNER_TEMP/shared-dlls.txt"
          APK=$(ls src/DashyNMS.Mobile/bin/Release/net10.0-android/*-Signed.apk | head -1)
          {
            echo "### Android Release"
            echo "- APK: $(stat -c %s "$APK") bytes ($(basename "$APK"))"
            echo "- DashyNMS.Agent.Shared.dll in obj:"
            sed 's/^/  - /' "$RUNNER_TEMP/shared-dlls.txt"
            echo "- Effective properties:"
            dotnet msbuild src/DashyNMS.Mobile -p:MobilePlatform=android -p:TargetFramework=net10.0-android -p:Configuration=Release \
              -getProperty:PublishTrimmed -getProperty:TrimMode -getProperty:RunAOTCompilation -getProperty:AndroidEnableProfiledAot \
              -getProperty:PublishAot -getProperty:UseInterpreter | sed 's/^/      /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashynms-android
          path: src/DashyNMS.Mobile/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: error

  ios:
    name: iOS (simulator)
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # iOS 27.1 enables the full Duo display and vertical system bars.
      # Keep the .NET workload paired with Xcode instead of runner defaults.
      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --version 10.0.402.1

      - name: Report iOS toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          dotnet workload --info

      # The home-screen widget is a Swift WidgetKit extension (ios-widget/),
      # built on its own and embedded by the app build below.
      - name: Build widget extension
        working-directory: ios-widget
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project DashyNMSWidget.xcodeproj -target DashyNMSWidget \
            -configuration Debug -sdk iphonesimulator \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build

      # The Swift bridge to Apple's on-device model (ios-intelligence/, #570):
      # only its Xcode project is generated here. The app build below builds
      # it, through the binding project's XcodeProject item.
      - name: Generate the Intelligence bridge's Xcode project
        working-directory: ios-intelligence
        run: xcodegen generate

      # The shared package (#596, #601) is verified after restore and before the
      # build compiles or packs it; see scripts/verify-shared-package.sh.
      - name: Restore and verify the shared package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet restore src/DashyNMS.Mobile.Shared
          scripts/verify-shared-package.sh

      # MobilePlatform=ios (see the csproj): on macOS the project also targets
      # Android, and restore would otherwise want that workload too.
      # A simulator build needs no signing identity; device builds and
      # App Store packaging are the TestFlight workflow's.
      - name: Build
        run: >
          dotnet build src/DashyNMS.Mobile -p:MobilePlatform=ios -c Debug -p:RuntimeIdentifier=iossimulator-arm64
          -p:IncludeIosWidget=true -p:IosWidgetBuildOutput=Debug-iphonesimulator

      - name: Check the widget is embedded
        run: |
          APP=$(find src/DashyNMS.Mobile/bin/Debug/net10.0-ios -maxdepth 3 -type d -name "*.app" | head -1)
          echo "App bundle: $APP"
          ls "$APP/PlugIns"
          test -d "$APP/PlugIns/DashyNMSWidget.appex"
          plutil -p "$APP/PlugIns/DashyNMSWidget.appex/Info.plist"

      # Before iOS 26 there's no FoundationModels.framework. Unless the bridge
      # loads it weakly, the app can't launch there at all (#570).
      - name: Check the Intelligence bridge is embedded and weak-linked
        run: |
          APP=$(find src/DashyNMS.Mobile/bin/Debug/net10.0-ios -maxdepth 3 -type d -name "*.app" | head -1)
          BRIDGE="$APP/Frameworks/DashyNMSIntelligence.framework/DashyNMSIntelligence"
          test -f "$BRIDGE"
          otool -l "$BRIDGE" | grep -A 3 LC_LOAD_WEAK_DYLIB | tee "$RUNNER_TEMP/weak.txt"
          grep -q "FoundationModels.framework" "$RUNNER_TEMP/weak.txt"
          if otool -l "$BRIDGE" | grep -A 3 "cmd LC_LOAD_DYLIB" | grep -q FoundationModels; then
            echo "FoundationModels is strongly linked"; exit 1
          fi
          otool -l "$BRIDGE" | grep -A 4 -E "LC_BUILD_VERSION|LC_VERSION_MIN" | grep -E "minos|version" || true

  # The shipping configuration TestFlight publishes (Release, ios-arm64: Mono AOT
  # and the SDK's default trimming), built unsigned on every push so the shared
  # shared package (#596, #601) and anything else reflection-sensitive is proved
  # through the device toolchain, not only the simulator's interpreter build.
  # It can't run here: installed-device checks are separate.
  ios-release:
    name: iOS Release (device, unsigned)
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --version 10.0.402.1

      - name: Report iOS toolchain
        run: |
          xcodebuild -version
          dotnet workload --info

      - name: Generate the Intelligence bridge's Xcode project
        working-directory: ios-intelligence
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      # The shared package (#596, #601) is verified after restore and before the
      # build compiles or packs it; see scripts/verify-shared-package.sh.
      - name: Restore and verify the shared package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet restore src/DashyNMS.Mobile.Shared
          scripts/verify-shared-package.sh

      # No widget (its signing needs TestFlight's profile) and no signing identity:
      # EnableCodeSigning=false builds the device app without a certificate.
      - name: Build
        shell: bash
        run: >
          dotnet build src/DashyNMS.Mobile -p:MobilePlatform=ios -f net10.0-ios -c Release
          -p:RuntimeIdentifier=ios-arm64 -p:EnableCodeSigning=false
          -bl:"$RUNNER_TEMP/ios-release.binlog" | tee "$RUNNER_TEMP/ios-release.log"

      - name: Check the shared package was trimmed and AOT-compiled
        run: |
          if grep -E "warning (IL[0-9]{4}|MT[0-9]{4}|NU[0-9]{4})" "$RUNNER_TEMP/ios-release.log" | grep -i "DashyNMS.Agent.Shared"; then
            echo "Warnings name DashyNMS.Agent.Shared"; exit 1
          fi
          APP=$(find src/DashyNMS.Mobile/bin/Release/net10.0-ios/ios-arm64 -maxdepth 2 -type d -name "*.app" | head -1)
          echo "App bundle: $APP"
          test -f "$APP/DashyNMS.Agent.Shared.dll"
          find src/DashyNMS.Mobile/obj/Release -iname "*DashyNMS.Agent.Shared*" \( -name "*.o" -o -name "*.s" -o -name "*.aotdata*" -o -name "*.dll" \) \
            -exec stat -f "%z bytes  %N" {} \; | tee "$RUNNER_TEMP/shared-aot.txt"
          grep -E "\.(o|s)$" "$RUNNER_TEMP/shared-aot.txt"
          {
            echo "### iOS Release (ios-arm64, unsigned)"
            echo "- .app: $(du -sk "$APP" | cut -f1) KiB"
            echo "- DashyNMS.Agent.Shared.dll in .app: $(stat -f %z "$APP/DashyNMS.Agent.Shared.dll") bytes"
            echo "- Shared package build outputs:"
            sed 's/^/  - /' "$RUNNER_TEMP/shared-aot.txt"
            echo "- Effective properties:"
            dotnet msbuild src/DashyNMS.Mobile -p:MobilePlatform=ios -p:TargetFramework=net10.0-ios -p:Configuration=Release -p:RuntimeIdentifier=ios-arm64 \
              -getProperty:PublishTrimmed -getProperty:TrimMode -getProperty:MtouchLink -getProperty:MtouchInterpreter \
              -getProperty:UseInterpreter -getProperty:PublishAot -getProperty:RunAOTCompilation | sed 's/^/      /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the Intelligence bridge is weak-linked in Release
        run: |
          APP=$(find src/DashyNMS.Mobile/bin/Release/net10.0-ios/ios-arm64 -maxdepth 2 -type d -name "*.app" | head -1)
          BRIDGE="$APP/Frameworks/DashyNMSIntelligence.framework/DashyNMSIntelligence"
          test -f "$BRIDGE"
          otool -l "$BRIDGE" | grep -A 3 LC_LOAD_WEAK_DYLIB | grep -q "FoundationModels.framework"
          if otool -l "$BRIDGE" | grep -A 3 "cmd LC_LOAD_DYLIB" | grep -q FoundationModels; then
            echo "FoundationModels is strongly linked"; exit 1
          fi
