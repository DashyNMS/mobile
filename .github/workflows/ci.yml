name: Build and test

on:
  push:
  pull_request:

# Read-only token: CI only checks out and builds (#7).
permissions:
  contents: read

jobs:
  # Shared code and the desktop's Core suite, on plain .NET - fast, and
  # catches upstream Core changes that don't hold up off Windows.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Test shared code
        run: dotnet test tests/DashyNMS.Mobile.Shared.Tests -c Debug

      - name: Test desktop Core (portable build)
        run: dotnet test tests/DesktopNMS.Core.Tests -c Debug

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: "21"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build
        run: dotnet build src/DashyNMS.Mobile -f net10.0-android -c Release

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashynms-android
          path: src/DashyNMS.Mobile/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: error

  ios:
    name: iOS (simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      # Pinned: workload set 10.0.401.1 brings .NET for iOS 27, which needs
      # Xcode 27 - newer than the macos-26 runner has. Move on when it does.
      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --version 10.0.401

      # The home-screen widget is a Swift WidgetKit extension (ios-widget/),
      # built on its own and embedded by the app build below.
      - name: Build widget extension
        working-directory: ios-widget
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project DashyNMSWidget.xcodeproj -target DashyNMSWidget \
            -configuration Debug -sdk iphonesimulator \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build

      # MobilePlatform=ios (see the csproj): on macOS the project also targets
      # Android, and restore would otherwise want that workload too.
      # A simulator build needs no signing identity; device builds and
      # App Store packaging are the TestFlight workflow's.
      - name: Build
        run: >
          dotnet build src/DashyNMS.Mobile -p:MobilePlatform=ios -c Debug -p:RuntimeIdentifier=iossimulator-arm64
          -p:IncludeIosWidget=true -p:IosWidgetBuildOutput=Debug-iphonesimulator

      - name: Check the widget is embedded
        run: |
          APP=$(find src/DashyNMS.Mobile/bin/Debug/net10.0-ios -maxdepth 3 -type d -name "*.app" | head -1)
          echo "App bundle: $APP"
          ls "$APP/PlugIns"
          test -d "$APP/PlugIns/DashyNMSWidget.appex"
          plutil -p "$APP/PlugIns/DashyNMSWidget.appex/Info.plist"
