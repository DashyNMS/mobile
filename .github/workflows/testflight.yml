name: TestFlight

# Builds a signed App Store IPA and uploads it to TestFlight. Run it by hand
# from the Actions tab (or `gh workflow run testflight.yml`); see
# docs/DEVELOPING.md, "Releasing", for the steps and the secrets it needs.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (blank: run number + offset). Must be higher than any build already in App Store Connect."
        required: false
        type: string

concurrency:
  group: testflight
  cancel-in-progress: false

# Read-only token: the upload uses the App Store Connect key, not GitHub (#7).
permissions:
  contents: read

jobs:
  testflight:
    name: Build and upload
    # The signing certificate and App Store Connect key live in this
    # environment's secrets, which only main and release/* can use and a maintainer has to
    # approve - so a workflow edited on another branch can't read them (#5).
    # See docs/DEVELOPING.md, "Releasing".
    environment: iOS-Build
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      # The home-screen widget ships only once its profile is in secrets
      # (docs/DEVELOPING.md, "Releasing"); until then builds are
      # the app alone, exactly as before.
      WITH_WIDGET: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The iOS 27 SDK, on GitHub's Xcode 27 image (in preview since
      # 2026-09-10) - no longer pinned to 10.0.401 for want of an Xcode 27 runner.
      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      # A throwaway keychain holding only the distribution certificate,
      # deleted again at the end of the job.
      - name: Install signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          # Installed under its UUID, and its name kept for the build step.
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/app.mobileprovision" "$PROFILES/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Install widget provisioning profile
        if: env.WITH_WIDGET == 'true'
        env:
          PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/widget.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/widget.mobileprovision" > "$RUNNER_TEMP/widget.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/widget.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/widget.plist")
          TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/widget.plist")
          cp "$RUNNER_TEMP/widget.mobileprovision" "$PROFILES/$UUID.mobileprovision"
          echo "WIDGET_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM" >> "$GITHUB_ENV"

      # App Store Connect rejects a build number it has seen before for this
      # app, including from builds uploaded before this workflow existed, so
      # it's this run's number plus an offset that clears them: 100, or the
      # IOS_BUILD_NUMBER_OFFSET repository variable. A number typed in when
      # starting the run wins over both.
      - name: Choose build number
        env:
          OFFSET: ${{ vars.IOS_BUILD_NUMBER_OFFSET || '100' }}
          REQUESTED: ${{ inputs.build_number }}
        run: |
          BUILD_NUMBER="${REQUESTED:-$((GITHUB_RUN_NUMBER + OFFSET))}"
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Build number must be a whole number, not '$BUILD_NUMBER'"
            exit 1
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Build number: $BUILD_NUMBER"

      # The widget's versions must match the app's, or App Store Connect
      # rejects the upload.
      - name: Build widget extension
        if: env.WITH_WIDGET == 'true'
        working-directory: ios-widget
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' ../Directory.Build.props)
          brew install xcodegen
          xcodegen generate
          xcodebuild -project DashyNMSWidget.xcodeproj -target DashyNMSWidget \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$WIDGET_PROFILE_NAME" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build
          echo "WIDGET_ARGS=-p:IncludeIosWidget=true -p:IosWidgetBuildOutput=Release-iphoneos" >> "$GITHUB_ENV"

      # MobilePlatform=ios (see the csproj) so restore doesn't also want the
      # Android workload; publish still insists on -f as well. The display
      # version comes from Directory.Build.props.
      - name: Build IPA
        run: >
          dotnet publish src/DashyNMS.Mobile
          -p:MobilePlatform=ios
          -f net10.0-ios
          -c Release
          -p:RuntimeIdentifier=ios-arm64
          -p:ArchiveOnBuild=true
          -p:CodesignKey="Apple Distribution"
          -p:CodesignProvision="$PROFILE_NAME"
          -p:ApplicationVersion=$BUILD_NUMBER
          $WIDGET_ARGS
          -o "$RUNNER_TEMP/ipa"

      # App Store Connect rejects an extension signed without entitlements
      # (90166), so check before spending an upload on it.
      - name: Check the widget's signature
        if: env.WITH_WIDGET == 'true'
        run: |
          IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          rm -rf "$RUNNER_TEMP/ipa-check" && mkdir "$RUNNER_TEMP/ipa-check"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa-check"
          APPEX=$(find "$RUNNER_TEMP/ipa-check/Payload" -name "DashyNMSWidget.appex" -type d | head -1)
          codesign -d --entitlements - --xml "$APPEX" > "$RUNNER_TEMP/widget-entitlements.xml"
          cat "$RUNNER_TEMP/widget-entitlements.xml"; echo
          grep -q "group.net.pckp.DashyNMS" "$RUNNER_TEMP/widget-entitlements.xml"
          grep -q "net.pckp.DashyNMS.widget" "$RUNNER_TEMP/widget-entitlements.xml"
          plutil -p "$APPEX/Info.plist"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          # altool looks for the key here by its id.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"

          IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Keep the IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashynms-ios-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf "$HOME/.appstoreconnect/private_keys"
