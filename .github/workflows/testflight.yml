name: TestFlight

# Builds a signed App Store IPA and uploads it to TestFlight. Run it by hand
# from the Actions tab (or `gh workflow run testflight.yml`); see
# docs/RELEASING-IOS.md for the one-time Apple setup and the secrets it needs.
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build and upload
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      # A throwaway keychain holding only the distribution certificate,
      # deleted again at the end of the job.
      - name: Install signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          # Installed under its UUID, and its name kept for the build step.
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/app.mobileprovision" "$PROFILES/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      # MobilePlatform=ios (see the csproj) so restore doesn't also want the
      # Android workload. The build number has to go up with every upload, so it's this
      # workflow's run number; the display version comes from Directory.Build.props.
      - name: Build IPA
        run: >
          dotnet publish src/DashyNMS.Mobile
          -p:MobilePlatform=ios
          -c Release
          -p:RuntimeIdentifier=ios-arm64
          -p:ArchiveOnBuild=true
          -p:CodesignKey="Apple Distribution"
          -p:CodesignProvision="$PROFILE_NAME"
          -p:ApplicationVersion=${{ github.run_number }}
          -o "$RUNNER_TEMP/ipa"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          # altool looks for the key here by its id.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"

          IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Keep the IPA
        uses: actions/upload-artifact@v5
        with:
          name: dashynms-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf "$HOME/.appstoreconnect/private_keys"
